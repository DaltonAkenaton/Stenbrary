<!--
  RUTA: src/app/app.component.html
  Shell de la aplicación: Sidebar + Topbar + Área de contenido
  Stenbrary v3.4 — Sin alertas fantasma

  FIX v3.4: Eliminado footer del sidebar con enlace a /alertas
  (ruta no implementada, causaba redirección silenciosa)
-->

<div class="app-shell" [class.sidebar-expanded]="isSidebarExpanded()">

  <!-- ══════════════════════════════════════════════════════
       SIDEBAR — Navegación lateral persistente
       64px colapsado / 220px expandido (via toggle del logo)
  ══════════════════════════════════════════════════════ -->
  <aside class="sidebar" [class.expanded]="isSidebarExpanded()">

    <!-- Logo / Toggle -->
    <button
      class="sidebar-logo"
      (click)="toggleSidebar()"
      [attr.aria-label]="isSidebarExpanded() ? 'Colapsar menú' : 'Expandir menú'"
      matRipple
      matRippleColor="rgba(0, 200, 215, 0.12)">
      <span class="logo-mark">S</span>
      @if (isSidebarExpanded()) {
        <span class="logo-text">tenbrary</span>
      }
    </button>

    <!-- Línea divisora después del logo -->
    <div class="sidebar-divider"></div>

    <!-- Nav items principales -->
    <nav class="sidebar-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [attr.aria-label]="item.label"
          [matTooltip]="!isSidebarExpanded() ? item.label : ''"
          matTooltipPosition="right"
          matRipple
          matRippleColor="rgba(0, 200, 215, 0.10)">
          <mat-icon>{{ item.icon }}</mat-icon>
          @if (isSidebarExpanded()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- Spacer empuja el footer hacia abajo -->
    <div class="sidebar-spacer"></div>

  </aside>

  <!-- ══════════════════════════════════════════════════════
       ÁREA PRINCIPAL — Topbar + Contenido de ruta
  ══════════════════════════════════════════════════════ -->
  <div class="main-area">

    <!-- Topbar -->
    <header class="topbar">
      <h1 class="topbar-title">{{ currentPageTitle }}</h1>
      <div class="topbar-end">
        <!-- Badge de estado — reactivo a navigator.onLine -->
        @if (isOnline()) {
          <span
            class="status-badge status-online"
            matTooltip="Conectado a internet — los datos se sincronizarán"
            matTooltipPosition="below">
            <span class="status-dot"></span>
            <mat-icon class="status-icon">wifi</mat-icon>
            Online
          </span>
        } @else {
          <span
            class="status-badge status-offline"
            matTooltip="Sin conexión — los registros se guardan localmente y se sincronizarán al reconectar"
            matTooltipPosition="below">
            <span class="status-dot"></span>
            <mat-icon class="status-icon">wifi_off</mat-icon>
            Offline
          </span>
        }
      </div>
    </header>

    <!-- Separador del topbar -->
    <div class="topbar-separator"></div>

    <!-- Contenido dinámico de cada ruta -->
    <main class="content-area">
      <router-outlet />
    </main>

  </div>

</div>

<!--
  app.component.html
  Shell de la aplicación — Stenbrary v3.0
  - Hamburger button en móvil
  - Backdrop clickable para cerrar sidebar
  - Animaciones suaves de sidebar
-->

<div class="app-shell" [class.sidebar-expanded]="isSidebarExpanded()">

  <!-- ══════════════════════════════════════════════════════
       BACKDROP — Oscurece contenido cuando sidebar está abierto (móvil)
  ══════════════════════════════════════════════════════ -->
  @if (isMobile() && isSidebarExpanded()) {
    <div class="sidebar-backdrop" (click)="closeSidebar()"></div>
  }

  <!-- ══════════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════════ -->
  <aside class="sidebar" [class.expanded]="isSidebarExpanded()">

    <!-- Logo / Toggle -->
    <button
      class="sidebar-logo"
      (click)="toggleSidebar()"
      [attr.aria-label]="isSidebarExpanded() ? 'Colapsar menú' : 'Expandir menú'"
      matRipple
      matRippleColor="rgba(0, 200, 215, 0.12)">
      <span class="logo-mark">S</span>
      @if (isSidebarExpanded()) {
        <span class="logo-text">tenbrary</span>
      }
    </button>

    <div class="sidebar-divider"></div>

    <!-- Nav items -->
    <nav class="sidebar-nav" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a
          class="nav-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          [attr.aria-label]="item.label"
          [matTooltip]="!isSidebarExpanded() ? item.label : ''"
          matTooltipPosition="right"
          matRipple
          matRippleColor="rgba(0, 200, 215, 0.10)">
          <mat-icon>{{ item.icon }}</mat-icon>
          @if (isSidebarExpanded()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-spacer"></div>
    <div class="sidebar-divider"></div>

    <!-- Footer -->
    <div class="sidebar-footer">
      <a
        class="nav-item"
        [routerLink]="alertNavItem.route"
        routerLinkActive="active"
        [attr.aria-label]="alertNavItem.label"
        [matTooltip]="!isSidebarExpanded() ? alertNavItem.label : ''"
        matTooltipPosition="right"
        matRipple
        matRippleColor="rgba(0, 200, 215, 0.10)">
        <mat-icon>{{ alertNavItem.icon }}</mat-icon>
        @if (isSidebarExpanded()) {
          <span class="nav-label">{{ alertNavItem.label }}</span>
        }
      </a>
    </div>

  </aside>

  <!-- ══════════════════════════════════════════════════════
       ÁREA PRINCIPAL
  ══════════════════════════════════════════════════════ -->
  <div class="main-area">

    <!-- Topbar -->
    <header class="topbar">
      <!-- Hamburger (solo en móvil) -->
      <button
        class="hamburger-btn"
        (click)="toggleSidebar()"
        aria-label="Abrir menú"
        matRipple
        matRippleColor="rgba(0, 200, 215, 0.15)">
        <mat-icon>menu</mat-icon>
      </button>

      <h1 class="topbar-title">{{ currentPageTitle }}</h1>

      <div class="topbar-end">
        <span class="status-badge status-online">
          <span class="status-dot"></span>
          Online
        </span>
      </div>
    </header>

    <div class="topbar-separator"></div>

    <main class="content-area">
      <router-outlet />
    </main>

  </div>

</div>

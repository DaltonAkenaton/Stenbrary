name: CI

on:
  push:
    # TEMPORAL (2026-10-26): `hardening/stenbrary-completo` tiene el historial
    # reescrito y no comparte ancestro con `main`, así que no puede abrir un PR.
    # Este trigger valida la rama en Linux antes de publicarla. Al publicar el
    # historial (main = esta rama), dejar solo `[main]`.
    branches: [main, hardening/stenbrary-completo]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version guardrail (package.json ↔ CHANGELOG)
        run: npm run check:version

      # El nombre de este job prometía "Lint" desde el principio, pero el paso
      # no existía porque el proyecto no tenía linter. Aquí va completo (con
      # avisos, no solo errores) para que la deuda contada de eslint.config.js
      # quede visible en el log de cada ejecución.
      - name: Lint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # Zona horaria de la biblioteca (Nuevo Laredo) a propósito. En UTC (la
      # del runner) parsear 'YYYY-MM-DD' como medianoche UTC coincide con la
      # local y los bugs de "el día anterior" son invisibles: así pasaron
      # meses sin que ningún test fallara (docs/AUDITORIA-2026-10.md, R1/R2).
      # Matamoros y no Ciudad de México: la frontera conserva el horario de
      # verano, y los días de 23 y 25 horas también rompen cálculos.
      - name: Unit tests (headless Chrome, hora de Nuevo Laredo)
        env:
          TZ: America/Matamoros
        run: npm run test:ci

      - name: Production build
        run: npx ng build --configuration production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Smoke E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        run: npm run e2e

      # v3.62.0: el build de producción servido con public/_headers (la CSP
      # que publica Cloudflare). Recorre la app buscando violaciones de la
      # CSP y comprueba el service worker sin conexión.
      - name: Production build (para las cabeceras)
        run: npx ng build --configuration production

      - name: E2E contra el build con cabeceras de seguridad
        run: npm run e2e:produccion

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

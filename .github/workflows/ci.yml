name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Type-check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version guardrail (package.json ↔ CHANGELOG)
        run: npm run check:version

      # El nombre de este job prometía "Lint" desde el principio, pero el paso
      # no existía porque el proyecto no tenía linter. Aquí va completo (con
      # avisos, no solo errores) para que la deuda contada de eslint.config.js
      # quede visible en el log de cada ejecución.
      - name: Lint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      # Zona horaria de México a propósito. En UTC (la del runner) parsear
      # 'YYYY-MM-DD' como medianoche UTC coincide con la local y los bugs de
      # "el día anterior" son invisibles: así pasaron meses sin que ningún
      # test fallara (docs/AUDITORIA-2026-10.md, R1/R2).
      - name: Unit tests (headless Chrome, hora de México)
        env:
          TZ: America/Mexico_City
        run: npm run test:ci

      - name: Production build
        run: npx ng build --configuration production

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: Smoke E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

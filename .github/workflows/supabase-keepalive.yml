# ║                                                      ║
# ║  v3.62.0: SOLO MANUAL. Antes corría a diario y en     ║
# ║  cada push para que el free tier de Supabase no       ║
# ║  pausara el proyecto de DESARROLLO. Con la Fase 2 en  ║
# ║  pausa y la nube apagada en la app, no hay necesidad  ║
# ║  operativa de mantenerlo despierto: no guarda datos   ║
# ║  reales y nadie lo usa.                               ║
# ║                                                      ║
# ║  Efecto: Supabase pausará el proyecto de desarrollo   ║
# ║  tras ~7 días sin peticiones. Se reanuda desde el     ║
# ║  panel de Supabase (o corriendo este job a mano       ║
# ║  desde Actions → "Supabase Keep-Alive" → Run). Al     ║
# ║  retomar la Fase 2, decidir si se vuelve a programar. ║
# ║  Producción nunca dependió de esto (ver               ║
# ║  docs/DESPLIEGUE-NUBE.md).                            ║
# ║                                                      ║
# ║  La clave es la "publishable" del proyecto de dev:    ║
# ║  pública por diseño (respeta RLS) y la misma que      ║
# ║  trae src/environments/environment.ts.                ║
# ╚══════════════════════════════════════════════════════╝

name: Supabase Keep-Alive

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase REST (toca Postgres = cuenta como actividad)
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://yhibkewgxhmwoemlvruy.supabase.co/rest/v1/motivos?select=id&limit=1" \
            -H "apikey: sb_publishable_pLIblkALe_5TbYyNJZQTTg_jnihv3sd" \
            -H "Authorization: Bearer sb_publishable_pLIblkALe_5TbYyNJZQTTg_jnihv3sd")
          echo "Supabase respondió HTTP $CODE"
          # 200 = ok (array, vacío o no, da igual: ya tocó la BD).
          # Cualquier 2xx/4xx significa que el proyecto está despierto.
          # Solo fallamos si no hubo respuesta (000 = pausado/caído).
          if [ "$CODE" = "000" ]; then
            echo "::error::Sin respuesta de Supabase. ¿Proyecto pausado o URL/key inválida?"
            exit 1
          fi
